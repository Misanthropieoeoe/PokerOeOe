<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Couronne Poker : couronne dorée sur tapis vert -->
  <defs>
    <radialGradient id="tapis" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2a8f55"/>
      <stop offset="1" stop-color="#0d4626"/>
    </radialGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.55" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#b8892a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tapis)"/>
  <!-- Corps de la couronne -->
  <path d="M12 44 L9 21 L22.5 31 L32 13 L41.5 31 L55 21 L52 44 Z" fill="url(#or)" stroke="#7a5512" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Bandeau -->
  <rect x="11" y="44" width="42" height="8" rx="2.5" fill="url(#or)" stroke="#7a5512" stroke-width="1.5"/>
  <!-- Perles au bout des pointes -->
  <circle cx="9" cy="20" r="3.4" fill="#fff6d6" stroke="#7a5512" stroke-width="1.2"/>
  <circle cx="32" cy="12" r="3.6" fill="#fff6d6" stroke="#7a5512" stroke-width="1.2"/>
  <circle cx="55" cy="20" r="3.4" fill="#fff6d6" stroke="#7a5512" stroke-width="1.2"/>
  <!-- Pique au centre -->
  <path d="M32 27 C32 27 25.5 32.6 25.5 36.4 C25.5 39.1 28.2 40.5 30.6 39.1 C30.2 40.7 29.6 41.9 28.7 42.8 L35.3 42.8 C34.4 41.9 33.8 40.7 33.4 39.1 C35.8 40.5 38.5 39.1 38.5 36.4 C38.5 32.6 32 27 32 27 Z" fill="#16181d"/>
  <!-- Pierres du bandeau -->
  <circle cx="20" cy="48" r="1.8" fill="#d0263a"/>
  <circle cx="32" cy="48" r="1.8" fill="#16181d"/>
  <circle cx="44" cy="48" r="1.8" fill="#d0263a"/>
</svg>
